<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAMAGM - 萬用動物市集</title>
  <style>
    /* 全域重設與字型 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      line-height: 1.6;
      padding-bottom: 60px;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 1.8rem;
      color: #111827;
      margin-bottom: 6px;
    }
    header p {
      color: #6b7280;
      font-size: 0.95rem;
    }

    /* 主要容器 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 商品卡片網格 (對應原截圖 3 欄排版) */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    /* 商品卡片樣式 */
    .product-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    /* 頂部標籤 */
    .product-tag {
      display: inline-block;
      align-self: flex-start;
      background-color: #e0f2fe;
      color: #0284c7;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    /* 商品主標題 */
    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111827;
      line-height: 1.45;
      margin-bottom: 12px;
      flex-grow: 1;
    }

    /* 🎬 影片標題展示區塊 (小於商品名稱，獨立排版) */
    .product-video-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.85rem;           /* 小於商品標題 */
      line-height: 1.4;
      color: #374151;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      text-align: left;
    }
    .product-video-title .video-icon {
      font-size: 0.95rem;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .product-video-title .video-text {
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;        /* 超過兩行自動省略，維持整齊度 */
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    /* 按鈕容器 */
    .product-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }

    /* 觀看短劇按鈕 (灰色框按鈕) */
    .btn-video {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px 14px;
      background-color: #f1f5f9;
      color: #1e293b;
      font-size: 0.92rem;
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-video:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
    }

    /* 前往 Amazon 按鈕 (橘色實心按鈕) */
    .btn-amazon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px 14px;
      background-color: #f59e0b;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 2px 4px rgba(245, 158, 11, 0.25);
      transition: background 0.15s ease;
    }
    .btn-amazon:hover {
      background-color: #d97706;
    }

    /* 影片彈窗 (Modal) */
    .video-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .video-modal.active {
      display: flex;
    }
    .modal-content {
      position: relative;
      background: #000;
      border-radius: 16px;
      width: 100%;
      max-width: 420px; /* 適合 YouTube Shorts 垂直比例 */
      aspect-ratio: 9 / 16;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-content iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <h1>HAMAGM 萬用動物市集</h1>
    <p>日常精選好物 × 療癒貓咪短劇</p>
  </header>

  <main class="container">
    <div id="product-container" class="product-grid">
      <!-- 商品卡片由 JavaScript 動態生成 -->
    </div>
  </main>

  <!-- YouTube Shorts 播放彈窗 -->
  <div id="videoModal" class="video-modal" onclick="closeVideoModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeVideoModal()">&times;</button>
      <iframe id="videoFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- 引用外部 products.js 資料庫 -->
  <script src="products.js"></script>

  <script>
    // 渲染所有日常精選市集商品
    function renderMarketProducts() {
      const container = document.getElementById('product-container');
      if (!container || typeof marketProducts === 'undefined') return;

      container.innerHTML = marketProducts.map(item => `
        <article class="product-card">
          <span class="product-tag">${item.tag || 'HOT'}</span>
          <h2 class="product-title">${item.title}</h2>

          <!-- 商品名稱下方、按鈕上方的影片名稱展示區塊 -->
          ${item.videoTitle ? `
            <div class="product-video-title">
              <span class="video-icon">🎬</span>
              <span class="video-text">${item.videoTitle}</span>
            </div>
          ` : ''}

          <div class="product-actions">
            ${item.videoId ? `
              <button class="btn-video" onclick="openVideoModal('${item.videoId}')">
                🎬 觀看貓咪短劇
              </button>
            ` : ''}
            <a href="${item.amazonUrl}" target="_blank" rel="noopener noreferrer" class="btn-amazon">
              前往 Amazon 查看 🛒
            </a>
          </div>
        </article>
      `).join('');
    }

    // 開啟 YouTube Shorts 彈窗
    function openVideoModal(videoId) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('videoFrame');
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      modal.classList.add('active');
    }

    // 關閉彈窗
    function closeVideoModal(e) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('videoFrame');
      iframe.src = '';
      modal.classList.remove('active');
    }

    // 頁面載入完成後執行渲染
    document.addEventListener('DOMContentLoaded', renderMarketProducts);
  </script>
</body>
</html>
